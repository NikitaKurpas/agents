web_search = "cached"
personality = "pragmatic"

[projects."/Users/nikitakurpas/Developer/aiTomo"]
trust_level = "trusted"

[projects."/Users/nikitakurpas/Developer/chadgpt"]
trust_level = "trusted"

[projects."/Users/nikitakurpas/Developer/mlx-bigram/mlx-bigram"]
trust_level = "trusted"

[projects."/Users/nikitakurpas/Developer/markrawl"]
trust_level = "trusted"

[projects."/Users/nikitakurpas/Developer/simnetctl"]
