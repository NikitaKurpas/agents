[projects."/Users/nikitakurpas/Developer/agents"]
trust_level = "trusted"

[projects."/Users/nikitakurpas/.codex"]
trust_level = "untrusted"

[projects."/Users/nikitakurpas/Developer/XcodeBuildMCP"]
