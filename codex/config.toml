[sandbox_workspace_write]
network_access = true
writable_roots = [
  "/Users/nikitakurpas/Library/Caches",
  "/Users/nikitakurpas/Library/Developer/Xcode/DerivedData",
  "/Users/nikitakurpas/Library/Developer/CoreSimulator",
  "/Users/nikitakurpas/Library/Logs/CoreSimulator"
]

[notice]
hide_gpt5_1_migration_prompt = true
"hide_gpt-5.1-codex-max_migration_prompt" = true

[notice.model_migrations]
"gpt-5.2" = "gpt-5.2-codex"
"gpt-5.1-codex-max" = "gpt-5.2-codex"

